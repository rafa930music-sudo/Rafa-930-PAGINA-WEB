  <style>
    :root {
      --bg: #050507;
      --card: rgba(17, 17, 24, 0.86);
      --border: #22222e;
      --lila: #a855f7;
      --rosa: #ec4899;
      --rojo: #e11d48;
      --cyan: #00d4ff;

    * {

      padding: 0;

    html, body {
      width: 100%;
      min-height: 100%;
      min-height: 100dvh;
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;

      overflow-x: hidden;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: stretch;
    }

    /* Canvas 3D de burbujas y constelación */
    #bg-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      pointer-events: none;
    }

    /* Línea superior idéntica a la web */
    .top-neon-line {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--lila), var(--cyan), var(--rosa));
      box-shadow: 0 0 14px rgba(0, 212, 255, 0.75);
      z-index: 120;
    }

    .text-gradient {
      background: linear-gradient(135deg, #c084fc 0%, #f472b6 50%, #fb7185 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      color: transparent;
    }

    /* =================================================================
       SPLASH SCREEN IDÉNTICO AL 100% A SplashScreen.tsx DE LA WEB
    ================================================================= */
    #splash {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      z-index: 100;
      background-color: #050507;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      cursor: pointer;
      user-select: none;
      overflow: hidden;
      opacity: 1;
      transform: scale(1);
      transition: opacity 0.55s cubic-bezier(0.16, 1, 0.3, 1), transform 0.55s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #splash.is-exiting {
      opacity: 0;
      transform: scale(1.03);
      pointer-events: none;
    }

    .splash-glow-1 {
      position: absolute;
      top: -7rem;
      left: 22%;
      width: 26rem;
      height: 26rem;
      border-radius: 50%;
      background: rgba(168, 85, 247, 0.22);
      filter: blur(130px);
      pointer-events: none;
    }

    .splash-glow-2 {
      position: absolute;
      top: 45%;
      right: 20%;
      width: 24rem;
      height: 24rem;
      border-radius: 50%;
      background: rgba(236, 72, 153, 0.20);
      filter: blur(130px);
      pointer-events: none;
    }

    .splash-glow-3 {
      position: absolute;
      bottom: -7rem;
      left: 30%;
      width: 22rem;
      height: 22rem;
      border-radius: 50%;
      background: rgba(225, 29, 72, 0.18);
      filter: blur(120px);
      pointer-events: none;
    }

    .splash-glow-4 {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 20rem;
      height: 20rem;
      border-radius: 50%;
      background: rgba(0, 212, 255, 0.14);
      filter: blur(120px);
      pointer-events: none;
    }

    .splash-frame {
      position: absolute;
      inset: clamp(1rem, 3vw, 2rem);
      border: 1px solid #22222e;
      border-radius: 16px;
      box-shadow: inset 0 0 40px rgba(0, 212, 255, 0.06);
      pointer-events: none;
    }

    .splash-wordmark {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: splashIn 0.65s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes splashIn {
      0% { opacity: 0; transform: translateY(8px) scale(0.97); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    .splash-title {
      font-family: 'Syne', 'Plus Jakarta Sans', sans-serif;
      font-weight: 800;
      font-size: clamp(2.65rem, 11vw, 6.75rem);
      letter-spacing: -0.02em;
      line-height: 1;
      white-space: nowrap;
      display: inline-flex;
      align-items: baseline;
      justify-content: center;
      gap: clamp(0.65rem, 2.2vw, 1.1rem);
      color: #ffffff;
      filter: drop-shadow(0 0 32px rgba(0, 212, 255, 0.18));
    }

    .splash-bar {
      margin-top: 1.15rem;
      height: 2px;
      width: clamp(7.5rem, 28vw, 11rem);
      border-radius: 999px;
      background: linear-gradient(90deg, var(--lila), var(--cyan), var(--rosa));
      box-shadow: 0 0 14px rgba(0, 212, 255, 0.6);
    }

    /* =================================================================
       LUCES FLOTANTES ANIMADAS DE FONDO
    ================================================================= */
    .ambient {
      position: fixed;
      border-radius: 50%;
      filter: blur(115px);
      pointer-events: none;
      z-index: 0;
    }
    .a1 {
      top: -60px; left: -60px; width: 320px; height: 320px;
      background: rgba(168, 85, 247, 0.22);
      animation: floatA 14s ease-in-out infinite;
    }
    .a2 {
      top: 38%; right: -60px; width: 320px; height: 320px;
      background: rgba(236, 72, 153, 0.20);
      animation: floatB 16s ease-in-out infinite;
    }
    .a3 {
      bottom: -60px; left: 20%; width: 300px; height: 300px;
      background: rgba(0, 212, 255, 0.16);
      animation: floatA 18s ease-in-out infinite reverse;
    }

    @keyframes floatA {
      0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
      50% { transform: translate3d(45px, -40px, 0) scale(1.14); }
    }

    @keyframes floatB {
      0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
      50% { transform: translate3d(-45px, 40px, 0) scale(1.12); }
    }

       CONTENEDOR LINKTREE PROFESIONAL 100% RESPONSIVE
    ================================================================= */

      z-index: 10;
      width: 100%;

      flex-direction: column;
      align-items: center;

    .top-row {

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .code-pill {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.68rem;
      color: var(--cyan);
      background: rgba(17, 17, 24, 0.8);
      border: 1px solid rgba(0, 212, 255, 0.35);
      padding: 0.35rem 0.7rem;
      border-radius: 999px;
      backdrop-filter: blur(10px);
    }

    .share-btn {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(12px);
      transition: all 0.2s ease;
    }

    .share-btn:hover {
      border-color: var(--cyan);
      color: var(--text);
    }

    .content {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: auto 0;
      padding: 0.5rem 0 1.15rem;
    }

    .avatar {
      position: relative;
      width: clamp(88px, 21vw, 104px);
      height: clamp(88px, 21vw, 104px);
      border-radius: 50%;
      padding: 2.5px;
      background: linear-gradient(135deg, var(--lila), var(--cyan), var(--rosa));
      box-shadow: 0 0 30px rgba(0, 212, 255, 0.26);
      margin-bottom: 0.75rem;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top;
      border-radius: 50%;
      border: 2.5px solid var(--bg);
      display: block;
    }

    .verified {
      position: absolute;
      bottom: 2px;
      right: 2px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--cyan);
      color: #050507;
      font-size: 11px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--bg);
      box-shadow: 0 0 10px var(--cyan);
    }

    .brand {
      font-family: 'Syne', 'Plus Jakarta Sans', sans-serif;
      font-weight: 800;
      font-size: clamp(1.85rem, 6vw, 2.25rem);
      letter-spacing: -0.02em;
      line-height: 1;
      display: inline-flex;
      align-items: baseline;
      gap: 0.4rem;
    }

    .tagline {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.74rem;
      color: var(--muted);
      margin-top: 0.35rem;
    }

    /* Tarjeta de Vídeo Destacado DE VUELTA */
    .video-card {
      width: 100%;
      margin-top: 1.15rem;
      border-radius: 16px;
      background: var(--card);
      border: 1px solid rgba(0, 212, 255, 0.45);
      box-shadow: 0 0 28px rgba(0, 212, 255, 0.16);
      overflow: hidden;
      backdrop-filter: blur(16px);
    }

    .video-stage {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #0a0a0f;
      cursor: pointer;
      overflow: hidden;
    }

    .video-stage img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.88;
      transition: transform 0.45s ease;
      display: block;
    }

    .video-stage:hover img {
      transform: scale(1.04);
    }

    .video-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(5, 5, 7, 0.85), rgba(5, 5, 7, 0.2), transparent);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .video-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      background: var(--rosa);
      color: #fff;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.62rem;
      font-weight: 700;
      padding: 0.28rem 0.55rem;
      border-radius: 6px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      box-shadow: 0 4px 12px rgba(236, 72, 153, 0.5);
    }

    .play-circle {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--lila), var(--rosa), var(--rojo));
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 26px rgba(236, 72, 153, 0.75);
      transition: transform 0.22s ease;
    }

    .video-stage:hover .play-circle {
      transform: scale(1.1);
    }

    .video-stage iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    .video-bar {
      padding: 0.65rem 0.9rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      border-top: 1px solid var(--border);

    .video-info-title {
      font-weight: 700;
      font-size: 0.88rem;
      color: #fff;
    }

    .video-info-sub {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.66rem;
      color: var(--cyan);

      align-items: center;
      gap: 0.3rem;

    .links {

      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      margin-top: 0.85rem;

    .btn {

      height: 54px;
      padding: 0 1rem;
      border-radius: 14px;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      backdrop-filter: blur(14px);
      transition: all 0.2s ease;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
    }

    .btn:hover {
      border-color: var(--cyan);
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(0, 212, 255, 0.16);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn.primary {
      background: linear-gradient(135deg, var(--lila) 0%, var(--rosa) 52%, var(--rojo) 100%);
      border: none;
      box-shadow: 0 6px 22px rgba(236, 72, 153, 0.38);
    }

    .btn-left {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .btn-icon-box {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: rgba(5, 5, 7, 0.85);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--cyan);
      flex-shrink: 0;
    }

    .btn.primary .btn-icon-box {
      background: rgba(0, 0, 0, 0.24);
      border-color: rgba(255, 255, 255, 0.25);
      color: #fff;
    }

    .btn-icon {
      width: 17px;
      height: 17px;
    }

    .btn-label {
      font-weight: 600;
      font-size: 0.92rem;
    }

    .btn-right {
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }

    .btn-sub {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.68rem;
      color: var(--muted);
    }

    .btn.primary .btn-sub {
      color: rgba(255, 255, 255, 0.88);
    }

    .btn-arrow {
      font-size: 0.9rem;
      color: var(--muted);
      transition: transform 0.2s ease, color 0.2s ease;
    }

    .btn.primary .btn-arrow {
      color: #fff;
    }

    .btn:hover .btn-arrow {
      transform: translate(2px, -2px);
      color: var(--cyan);
    }

    .btn.primary:hover .btn-arrow {
      color: #fff;
    }

    .footer {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.68rem;
      color: rgba(161, 161, 181, 0.55);
      padding-top: 0.65rem;
    }

    #toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(15px);
      background: #111118;
      border: 1px solid var(--cyan);
      color: #fff;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.74rem;
      padding: 0.5rem 1rem;
      border-radius: 10px;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s ease;
      z-index: 130;
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>

  <div id="toast">Enlace copiado</div>

  <script>
    // 1. Splash screen idéntico a la web
    const splash = document.getElementById('splash');
    let dismissed = false;
    function closeSplash() {
      if (dismissed || !splash) return;
      dismissed = true;
      splash.classList.add('is-exiting');
      setTimeout(() => {
        if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
      }, 550);
    }
    splash.addEventListener('click', closeSplash);
    setTimeout(closeSplash, 1600);

    // 2. Reproductor integrado del vídeo De Vuelta (RVuiWbT_mNk)
    const videoStage = document.getElementById('videoStage');
    videoStage.addEventListener('click', () => {
      videoStage.innerHTML = '<iframe src="https://www.youtube.com/embed/RVuiWbT_mNk?autoplay=1&rel=0" title="RAFA 930 - De Vuelta" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>';
    });

    // 3. Botón compartir
    const shareBtn = document.getElementById('shareBtn');
    const toast = document.getElementById('toast');
    shareBtn.addEventListener('click', async () => {
      const url = window.location.href;
      if (navigator.share) {
        try {
          await navigator.share({ title: 'RAFA 930', url });
          return;
        } catch (e) {}
      }
      try {
        await navigator.clipboard.writeText(url);
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2000);
      } catch (e) {}
    });

    // 4. Fondo animado 3D (Burbujas de neón + Red de constelación)
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let width = (canvas.width = window.innerWidth);
    let height = (canvas.height = window.innerHeight);

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    const palette = ['#a855f7', '#00d4ff', '#ec4899', '#e11d48'];
    const orbs = Array.from({ length: 34 }, (_, i) => ({
      x: Math.random() * width,
      y: Math.random() * height,
      z: 0.3 + Math.random() * 0.9,
      r: 3 + Math.random() * 20,
      vx: (Math.random() - 0.5) * 0.65,
      vy: -0.35 - Math.random() * 0.75,
      color: palette[i % palette.length],
      phase: Math.random() * Math.PI * 2
    }));

    let tick = 0;
    function animate() {
      tick += 0.02;
      ctx.clearRect(0, 0, width, height);

      for (let i = 0; i < orbs.length; i++) {
        for (let j = i + 1; j < orbs.length; j++) {
          const dx = orbs[i].x - orbs[j].x;
          const dy = orbs[i].y - orbs[j].y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 135) {
            ctx.save();
            ctx.strokeStyle = '#00d4ff';
            ctx.globalAlpha = (1 - dist / 135) * 0.12;
            ctx.lineWidth = 0.8;
            ctx.beginPath();
            ctx.moveTo(orbs[i].x, orbs[i].y);
            ctx.lineTo(orbs[j].x, orbs[j].y);
            ctx.stroke();
            ctx.restore();
          }
        }
      }

      for (const o of orbs) {
        o.x += o.vx * o.z + Math.sin(tick + o.phase) * 0.25;
        o.y += o.vy * o.z;
        if (o.y + o.r < -20) {
          o.y = height + o.r + 10;
          o.x = Math.random() * width;
        }
        if (o.x < -30) o.x = width + 30;
        if (o.x > width + 30) o.x = -30;

        const radius = o.r * o.z;
        const grad = ctx.createRadialGradient(
          o.x - radius * 0.3,
          o.y - radius * 0.3,
          radius * 0.08,
          o.x,
          o.y,
          radius
        );
        grad.addColorStop(0, '#ffffff');
        grad.addColorStop(0.35, o.color);
        grad.addColorStop(1, 'transparent');

        ctx.save();
        ctx.globalAlpha = 0.22 + Math.sin(tick * 1.5 + o.phase) * 0.08;
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(o.x, o.y, radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
      requestAnimationFrame(animate);
    }
    animate();
  </script>
